apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: payments-api-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
      - name: app
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: payments-api-dev
spec:
  selector:
    app: payments-api
  ports:
  - port: 80
    targetPort: 80
